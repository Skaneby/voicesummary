<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API-test – VoiceSummary</title>
<style>
body{font-family:system-ui;max-width:500px;margin:40px auto;padding:20px;background:#0f0f1a;color:#e8e8f0}
h2{color:#e94560;margin-bottom:20px}
input{width:100%;padding:12px;background:#1e1e3a;border:1px solid #2a2a45;border-radius:8px;color:#e8e8f0;font-size:1rem;box-sizing:border-box;margin-bottom:12px}
button{background:#e94560;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:1rem;cursor:pointer;width:100%}
pre{background:#1e1e3a;padding:16px;border-radius:8px;font-size:.8rem;white-space:pre-wrap;word-break:break-all;margin-top:16px;border:1px solid #2a2a45}
.ok{color:#22c55e}.err{color:#e94560}
</style>
</head>
<body>
<h2>🔑 API-nyckel diagnostik</h2>
<p style="color:#8888aa;font-size:.9rem;margin-bottom:16px">Testar anslutning till Gemini API utan ljud</p>
<input type="password" id="key" placeholder="Klistra in din Gemini API-nyckel (AIza...)" autocapitalize="off" spellcheck="false">
<button onclick="test()">Testa API-nyckel</button>
<pre id="out">Tryck Testa...</pre>
<script>
async function test() {
  const key = document.getElementById('key').value.trim();
  const out = document.getElementById('out');
  if (!key) { out.textContent = 'Ange en API-nyckel'; return; }
  out.textContent = 'Ansluter till Gemini...';
  try {
    const r = await fetch(
      'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + key,
      {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({contents:[{parts:[{text:'Svara med: OK'}]}]})
      }
    );
    const data = await r.json();
    if (r.ok) {
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '(tomt svar)';
      out.className = 'ok';
      out.textContent = '✅ API-nyckel fungerar!\n\nSvar från Gemini: ' + reply;
    } else {
      out.className = 'err';
      out.textContent = '❌ API-fel ' + r.status + '\n\n' + JSON.stringify(data, null, 2);
    }
  } catch(e) {
    out.className = 'err';
    out.textContent = '❌ ' + e.name + ': ' + e.message + '\n\nDetta betyder troligen:\n• Felaktig API-nyckel\n• Nyckeln har domänrestriktioner i Google Cloud Console\n• Nätverksfel\n\nLösning: Gå till aistudio.google.com → Get API key → skapa NY nyckel utan restriktioner';
  }
}
document.getElementById('key').addEventListener('keydown', e => { if (e.key === 'Enter') test(); });
</script>
</body>
</html>
